<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Data moving at the speed of light">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f22"/>
      <stop offset="1" stop-color="#050610"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e1b0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#b06bff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38e1b0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38e1b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="600" cy="338" r="320" fill="url(#glow)"/>

  <g stroke="url(#streak)" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="80" y1="150" x2="1120" y2="150"/>
    <line x1="180" y1="230" x2="1020" y2="230"/>
    <line x1="60" y1="330" x2="1140" y2="330"/>
    <line x1="200" y1="430" x2="1000" y2="430"/>
    <line x1="120" y1="520" x2="1080" y2="520"/>
  </g>

  <g transform="translate(600 338)">
    <path d="M-40 -150 L20 -30 L-15 -30 L45 150 L-25 10 L15 10 Z"
          fill="#eafff7" stroke="#38e1b0" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <text x="600" y="620" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif"
        font-size="64" font-weight="700" fill="#ffffff" opacity="0.9">0.00&#8201;ms</text>
</svg>
